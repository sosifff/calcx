name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ──────── Capacitor проект ────────
      - name: Capacitor project
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/android@6 @capacitor/app@6
          npm i -D @capacitor/cli@6 @capacitor/assets@3
          npx cap init CalcX com.gkk.calcx --web-dir=www
          npx cap add android

      # ──────── Веб-файлы в www/ ────────
      - name: Prepare web assets
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/; fi
          if [ -f app.js ];     then cp app.js     www/; fi
          if [ -f style.css ];  then cp style.css  www/; fi

      # ──────── Имя приложения: CalcX ────────
      - name: Set app name to CalcX
        run: |
          python3 - <<'PY'
          import os
          p = 'android/app/src/main/res/values/strings.xml'
          os.makedirs(os.path.dirname(p), exist_ok=True)
          content = '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">CalcX</string>
              <string name="title_activity_main">CalcX</string>
              <string name="package_name">com.gkk.calcx</string>
              <string name="custom_url_scheme">com.gkk.calcx</string>
          </resources>
          '''
          open(p, 'w', encoding='utf-8').write(content)
          print('strings.xml записан: CalcX')
          PY

      # ──────── Иконка из assets/icon.png ────────
      - name: Generate app icons
        run: |
          if [ -f assets/icon.png ]; then
            echo "Нашёл assets/icon.png ($(stat -c %s assets/icon.png) байт)"
            npx @capacitor/assets generate \
              --android \
              --iconBackgroundColor '#3B2C00' \
              --iconBackgroundColorDark '#3B2C00'
          elif [ -f icon.png ]; then
            echo "Нашёл icon.png в корне, переношу в assets/"
            mkdir -p assets
            cp icon.png assets/icon.png
            npx @capacitor/assets generate \
              --android \
              --iconBackgroundColor '#3B2C00' \
              --iconBackgroundColorDark '#3B2C00'
          else
            echo "⚠ assets/icon.png не найден — используется дефолтная иконка"
          fi

      # ──────── Нативный код + edge-to-edge ────────
      - name: Native code (vibration, Material You, .calc, edge-to-edge)
        run: |
          D=android/app/src/main/java/com/gkk/calcx
          mkdir -p $D

          cat > $D/NativeTools.java <<'EOF'
          package com.gkk.calcx;

          import android.content.Context;
          import android.os.Build;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "NativeTools")
          public class NativeTools extends Plugin {
            public static String pendingText = null;
            public static String pendingName = "";

            @SuppressWarnings("deprecation")
            @PluginMethod
            public void vibrate(PluginCall call) {
              try {
                Vibrator v = (Vibrator) getContext().getSystemService(Context.VIBRATOR_SERVICE);
                if (v == null || !v.hasVibrator()) { call.resolve(); return; }
                JSArray arr = call.getArray("pattern");
                if (arr != null && arr.length() > 0) {
                  long[] t = new long[arr.length() + 1];
                  t[0] = 0;
                  for (int i = 0; i < arr.length(); i++) t[i + 1] = Math.max(0, arr.getLong(i));
                  if (Build.VERSION.SDK_INT >= 26) v.vibrate(VibrationEffect.createWaveform(t, -1));
                  else v.vibrate(t, -1);
                } else {
                  long d = Math.max(15, Math.min(500, call.getInt("duration", 20)));
                  if (Build.VERSION.SDK_INT >= 26) v.vibrate(VibrationEffect.createOneShot(d, VibrationEffect.DEFAULT_AMPLITUDE));
                  else v.vibrate(d);
                }
                call.resolve();
              } catch (Exception e) {
                call.reject(String.valueOf(e.getMessage()));
              }
            }

            @PluginMethod
            public void getColors(PluginCall call) {
              if (Build.VERSION.SDK_INT < 31) { call.reject("Android 12+ required"); return; }
              JSObject o = new JSObject();
              String[][] sets = {
                {"a1", "system_accent1_"}, {"a2", "system_accent2_"}, {"a3", "system_accent3_"},
                {"n1", "system_neutral1_"}, {"n2", "system_neutral2_"}
              };
              int[] tones = {0, 10, 50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000};
              for (String[] s : sets) {
                for (int t : tones) {
                  int id = getContext().getResources().getIdentifier(s[1] + t, "color", "android");
                  if (id != 0) {
                    int c = getContext().getResources().getColor(id, getContext().getTheme());
                    o.put(s[0] + "_" + t, String.format("#%06X", 0xFFFFFF & c));
                  }
                }
              }
              call.resolve(o);
            }

            @PluginMethod
            public void getPending(PluginCall call) {
              JSObject o = new JSObject();
              if (pendingText != null) {
                o.put("text", pendingText);
                o.put("name", pendingName);
                pendingText = null;
              }
              call.resolve(o);
            }
          }
          EOF

          cat > $D/MainActivity.java <<'EOF'
          package com.gkk.calcx;

          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(NativeTools.class);
              super.onCreate(savedInstanceState);

              Window w = getWindow();
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                WindowCompat.setDecorFitsSystemWindows(w, false);
              } else {
                w.getDecorView().setSystemUiVisibility(
                  View.SYSTEM_UI_FLAG_LAYOUT_STABLE |
                  View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                  View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                );
              }
              w.clearFlags(WindowManager.LayoutParams.FLAG_TRANSLUCENT_STATUS);
              w.clearFlags(WindowManager.LayoutParams.FLAG_TRANSLUCENT_NAVIGATION);
              w.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
              w.setStatusBarColor(Color.TRANSPARENT);
              w.setNavigationBarColor(Color.TRANSPARENT);

              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                w.setNavigationBarContrastEnforced(false);
                w.setStatusBarContrastEnforced(false);
              }

              WindowInsetsControllerCompat c =
                new WindowInsetsControllerCompat(w, w.getDecorView());
              c.setAppearanceLightStatusBars(false);
              c.setAppearanceLightNavigationBars(false);

              handle(getIntent(), false);
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus && Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              }
            }

            @Override
            protected void onNewIntent(Intent intent) {
              super.onNewIntent(intent);
              handle(intent, true);
            }

            @SuppressWarnings("deprecation")
            private void handle(Intent i, boolean live) {
              if (i == null) return;
              String action = i.getAction();
              String text = null;
              String name = "";
              try {
                if (Intent.ACTION_VIEW.equals(action) && i.getData() != null) {
                  Uri u = i.getData();
                  text = read(u);
                  name = String.valueOf(u.getLastPathSegment());
                } else if (Intent.ACTION_SEND.equals(action)) {
                  Uri u = (Uri) i.getParcelableExtra(Intent.EXTRA_STREAM);
                  if (u != null) {
                    text = read(u);
                    name = String.valueOf(u.getLastPathSegment());
                  } else {
                    text = i.getStringExtra(Intent.EXTRA_TEXT);
                  }
                }
              } catch (Exception e) {
                return;
              }
              if (text == null || text.isEmpty()) return;
              NativeTools.pendingText = text;
              NativeTools.pendingName = name;
              if (live && getBridge() != null && getBridge().getWebView() != null) {
                final String js = "window.openCalcText&&window.openCalcText("
                  + JSONObject.quote(text) + "," + JSONObject.quote(name) + ")";
                getBridge().getWebView().post(new Runnable() {
                  public void run() { getBridge().getWebView().evaluateJavascript(js, null); }
                });
                NativeTools.pendingText = null;
              }
            }

            private String read(Uri u) throws Exception {
              InputStream in = getContentResolver().openInputStream(u);
              ByteArrayOutputStream out = new ByteArrayOutputStream();
              byte[] b = new byte[4096];
              int n, total = 0;
              while ((n = in.read(b)) > 0) {
                out.write(b, 0, n);
                total += n;
                if (total > 300000) break;
              }
              in.close();
              return out.toString("UTF-8");
            }
          }
          EOF

          # Edge-to-edge тема
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
                  <item name="android:windowDrawsSystemBarBackgrounds">true</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
              </style>
          </resources>
          EOF

          cat > android/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="status_bar_color">#00000000</color>
              <color name="navigation_bar_color">#00000000</color>
          </resources>
          EOF

      # ──────── Патч AndroidManifest ────────
      - name: Patch AndroidManifest
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()

          perms = ''
          if 'android.permission.VIBRATE' not in s:
              perms += '    <uses-permission android:name="android.permission.VIBRATE"/>\n'
          if 'android.permission.CAMERA' not in s:
              perms += '    <uses-permission android:name="android.permission.CAMERA"/>\n'
          if perms:
              s = s.replace('</manifest>', perms + '</manifest>')

          filters = r'''
              <intent-filter>
                <action android:name="android.intent.action.VIEW"/>
                <category android:name="android.intent.category.DEFAULT"/>
                <category android:name="android.intent.category.BROWSABLE"/>
                <data android:scheme="content"/>
                <data android:scheme="file"/>
                <data android:mimeType="text/plain"/>
              </intent-filter>
              <intent-filter>
                <action android:name="android.intent.action.VIEW"/>
                <category android:name="android.intent.category.DEFAULT"/>
                <category android:name="android.intent.category.BROWSABLE"/>
                <data android:scheme="content" android:host="*" android:mimeType="*/*" android:pathPattern=".*\\.calc"/>
                <data android:scheme="file" android:host="*" android:mimeType="*/*" android:pathPattern=".*\\.calc"/>
              </intent-filter>
              <intent-filter>
                <action android:name="android.intent.action.SEND"/>
                <category android:name="android.intent.category.DEFAULT"/>
                <data android:mimeType="text/plain"/>
              </intent-filter>
          '''
          if 'android.intent.action.VIEW' not in s:
              assert '</activity>' in s
              s = s.replace('</activity>', filters + '</activity>', 1)

          s = s.replace('android:theme="@style/AppTheme"',
                        'android:theme="@style/AppTheme.NoActionBar"')

          if 'android:configChanges' not in s:
              s = s.replace(
                'android:name=".MainActivity"',
                'android:name=".MainActivity"\n            android:configChanges="orientation|screenSize|keyboardHidden|uiMode"'
              )

          open(p, 'w', encoding='utf-8').write(s)
          print('AndroidManifest пропатчен')
          PY

      # ──────── Синхронизация и сборка ────────
      - name: Sync and build
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CalcX-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CalcX build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk