name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Capacitor project
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/android@6
          npm i -D @capacitor/cli@6
          npx cap init CalcX com.gkk.calcx --web-dir=www
          npx cap add android

      - name: Prepare web assets
        run: |
          ls -la www/

      - name: Set app name to CalcX
        run: |
          python3 - <<'PY'
          import os
          p = 'android/app/src/main/res/values/strings.xml'
          os.makedirs(os.path.dirname(p), exist_ok=True)
          content = '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">CalcX</string>
              <string name="title_activity_main">CalcX</string>
              <string name="package_name">com.gkk.calcx</string>
              <string name="custom_url_scheme">com.gkk.calcx</string>
          </resources>
          '''
          open(p, 'w', encoding='utf-8').write(content)
          print('strings.xml -> CalcX')
          PY

      - name: Generate app icons
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw

          src_candidates = ['assets/icon.png', 'icon.png', 'www/icon.png']
          src = None
          for c in src_candidates:
              if os.path.exists(c) and os.path.getsize(c) > 100:
                  src = c
                  break

          if not src:
              print('icon.png не найден — пропускаю')
              raise SystemExit(0)

          print(f'Источник иконки: {src} ({os.path.getsize(src)} байт)')
          img = Image.open(src).convert('RGBA')

          sizes = {
              'mipmap-mdpi':    48,
              'mipmap-hdpi':    72,
              'mipmap-xhdpi':   96,
              'mipmap-xxhdpi':  144,
              'mipmap-xxxhdpi': 192,
          }

          base = 'android/app/src/main/res'

          for folder, size in sizes.items():
              d = os.path.join(base, folder)
              os.makedirs(d, exist_ok=True)

              sq = Image.new('RGBA', (size, size), (59, 44, 0, 255))
              resized = img.copy()
              resized.thumbnail((int(size*0.85), int(size*0.85)), Image.LANCZOS)
              offset = ((size - resized.width)//2, (size - resized.height)//2)
              sq.paste(resized, offset, resized)
              sq.save(os.path.join(d, 'ic_launcher.png'))

              round_img = Image.new('RGBA', (size, size), (0,0,0,0))
              mask = Image.new('L', (size, size), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, size, size), fill=255)
              round_img.paste(sq, (0,0), mask)
              round_img.save(os.path.join(d, 'ic_launcher_round.png'))

              fg_size = int(size * 1.5)
              fg = Image.new('RGBA', (fg_size, fg_size), (0,0,0,0))
              fg_resized = img.copy()
              fg_resized.thumbnail((int(size*0.7), int(size*0.7)), Image.LANCZOS)
              fg_offset = ((fg_size - fg_resized.width)//2, (fg_size - fg_resized.height)//2)
              fg.paste(fg_resized, fg_offset, fg_resized)
              fg.save(os.path.join(d, 'ic_launcher_foreground.png'))

          print('Иконки сгенерированы')
          PY

      - name: Native code
        run: |
          D=android/app/src/main/java/com/gkk/calcx
          mkdir -p $D

          cat > $D/NativeTools.java <<'EOF'
          package com.gkk.calcx;

          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;
          import java.util.ArrayList;

          @CapacitorPlugin(
            name = "NativeTools",
            permissions = {
              @Permission(
                alias = "microphone",
                strings = { Manifest.permission.RECORD_AUDIO }
              )
            }
          )
          public class NativeTools extends Plugin {
            public static String pendingText = null;
            public static String pendingName = "";

            private SpeechRecognizer recognizer;
            private PluginCall activeSpeechCall;
            private final Handler mainHandler = new Handler(Looper.getMainLooper());

            @SuppressWarnings("deprecation")
            @PluginMethod
            public void vibrate(PluginCall call) {
              try {
                Vibrator v = (Vibrator) getContext().getSystemService(Context.VIBRATOR_SERVICE);
                if (v == null || !v.hasVibrator()) { call.resolve(); return; }
                JSArray arr = call.getArray("pattern");
                if (arr != null && arr.length() > 0) {
                  long[] t = new long[arr.length() + 1];
                  t[0] = 0;
                  for (int i = 0; i < arr.length(); i++) t[i + 1] = Math.max(0, arr.getLong(i));
                  if (Build.VERSION.SDK_INT >= 26) v.vibrate(VibrationEffect.createWaveform(t, -1));
                  else v.vibrate(t, -1);
                } else {
                  long d = Math.max(15, Math.min(500, call.getInt("duration", 20)));
                  if (Build.VERSION.SDK_INT >= 26) v.vibrate(VibrationEffect.createOneShot(d, VibrationEffect.DEFAULT_AMPLITUDE));
                  else v.vibrate(d);
                }
                call.resolve();
              } catch (Exception e) {
                call.reject(String.valueOf(e.getMessage()));
              }
            }

            @PluginMethod
            public void getColors(PluginCall call) {
              if (Build.VERSION.SDK_INT < 31) { call.reject("Android 12+ required"); return; }
              JSObject o = new JSObject();
              String[][] sets = {
                {"a1", "system_accent1_"}, {"a2", "system_accent2_"}, {"a3", "system_accent3_"},
                {"n1", "system_neutral1_"}, {"n2", "system_neutral2_"}
              };
              int[] tones = {0, 10, 50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000};
              for (String[] s : sets) {
                for (int t : tones) {
                  int id = getContext().getResources().getIdentifier(s[1] + t, "color", "android");
                  if (id != 0) {
                    int c = getContext().getResources().getColor(id, getContext().getTheme());
                    o.put(s[0] + "_" + t, String.format("#%06X", 0xFFFFFF & c));
                  }
                }
              }
              call.resolve(o);
            }

            @PluginMethod
            public void getPending(PluginCall call) {
              JSObject o = new JSObject();
              if (pendingText != null) {
                o.put("text", pendingText);
                o.put("name", pendingName);
                pendingText = null;
              }
              call.resolve(o);
            }

            @PluginMethod
            public void requestAudio(PluginCall call) {
              if (Build.VERSION.SDK_INT >= 23 &&
                  getContext().checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                    != PackageManager.PERMISSION_GRANTED) {
                requestPermissionForAlias("microphone", call, "audioCallback");
              } else {
                call.resolve();
              }
            }

            @PermissionCallback
            private void audioCallback(PluginCall call) {
              call.resolve();
            }

            @PluginMethod
            public void isSpeechAvailable(PluginCall call) {
              JSObject o = new JSObject();
              o.put("available", SpeechRecognizer.isRecognitionAvailable(getContext()));
              call.resolve(o);
            }

            @PluginMethod
            public void listen(PluginCall call) {
              if (Build.VERSION.SDK_INT >= 23 &&
                  getContext().checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                    != PackageManager.PERMISSION_GRANTED) {
                requestPermissionForAlias("microphone", call, "listenAfterPermission");
                return;
              }
              startListening(call);
            }

            @PermissionCallback
            private void listenAfterPermission(PluginCall call) {
              startListening(call);
            }

            private void startListening(final PluginCall call) {
              mainHandler.post(new Runnable() {
                @Override
                public void run() {
                  try {
                    if (!SpeechRecognizer.isRecognitionAvailable(getContext())) {
                      call.reject("Распознавание речи недоступно на этом устройстве");
                      return;
                    }

                    if (recognizer != null) {
                      try { recognizer.destroy(); } catch (Exception ignored) {}
                      recognizer = null;
                    }
                    if (activeSpeechCall != null) {
                      activeSpeechCall.reject("Новый запрос вместо предыдущего");
                      activeSpeechCall = null;
                    }

                    final String lang = call.getString("lang", "ru-RU");

                    recognizer = SpeechRecognizer.createSpeechRecognizer(getContext());
                    activeSpeechCall = call;

                    recognizer.setRecognitionListener(new RecognitionListener() {
                      @Override public void onReadyForSpeech(Bundle params) {}
                      @Override public void onBeginningOfSpeech() {}
                      @Override public void onRmsChanged(float rmsdB) {}
                      @Override public void onBufferReceived(byte[] buffer) {}
                      @Override public void onEndOfSpeech() {}

                      @Override
                      public void onError(int error) {
                        if (activeSpeechCall == null) return;
                        String message;
                        switch (error) {
                          case SpeechRecognizer.ERROR_NO_MATCH: message = "Не расслышал"; break;
                          case SpeechRecognizer.ERROR_SPEECH_TIMEOUT: message = "Тишина"; break;
                          case SpeechRecognizer.ERROR_AUDIO: message = "Ошибка аудио"; break;
                          case SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS: message = "Нет доступа к микрофону"; break;
                          case SpeechRecognizer.ERROR_NETWORK:
                          case SpeechRecognizer.ERROR_NETWORK_TIMEOUT: message = "Проблема с интернетом"; break;
                          default: message = "Ошибка распознавания: " + error;
                        }
                        activeSpeechCall.reject(message);
                        activeSpeechCall = null;
                        cleanup();
                      }

                      @Override
                      public void onResults(Bundle results) {
                        if (activeSpeechCall == null) return;
                        ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                        String text = (matches != null && !matches.isEmpty()) ? matches.get(0) : "";
                        JSObject o = new JSObject();
                        o.put("text", text);
                        activeSpeechCall.resolve(o);
                        activeSpeechCall = null;
                        cleanup();
                      }

                      @Override public void onPartialResults(Bundle partialResults) {}
                      @Override public void onEvent(int eventType, Bundle params) {}
                    });

                    Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                    intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                    intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, lang);
                    intent.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                    intent.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1);

                    recognizer.startListening(intent);
                  } catch (Exception e) {
                    call.reject(String.valueOf(e.getMessage()));
                    cleanup();
                  }
                }
              });
            }

            @PluginMethod
            public void stopListening(PluginCall call) {
              mainHandler.post(new Runnable() {
                @Override
                public void run() {
                  if (recognizer != null) {
                    try { recognizer.stopListening(); } catch (Exception ignored) {}
                  }
                  if (activeSpeechCall != null) {
                    activeSpeechCall.reject("Остановлено пользователем");
                    activeSpeechCall = null;
                  }
                  call.resolve();
                }
              });
            }

            private void cleanup() {
              if (recognizer != null) {
                try { recognizer.destroy(); } catch (Exception ignored) {}
                recognizer = null;
              }
            }

            @Override
            protected void handleOnDestroy() {
              cleanup();
              super.handleOnDestroy();
            }
          }
          EOF

          cat > $D/MainActivity.java <<'EOF'
          package com.gkk.calcx;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.PermissionRequest;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
            private static final int REQ_PERMS = 1001;

            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(NativeTools.class);
              super.onCreate(savedInstanceState);

              Window w = getWindow();
              w.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
              w.setStatusBarColor(Color.TRANSPARENT);
              w.setNavigationBarColor(Color.TRANSPARENT);

              int ui = View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                     | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                     | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN;

              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                w.setNavigationBarContrastEnforced(false);
                w.setStatusBarContrastEnforced(false);
              }

              w.getDecorView().setSystemUiVisibility(ui);

              requestStartupPermissions();

              handle(getIntent(), false);
            }

            private void requestStartupPermissions() {
              if (Build.VERSION.SDK_INT < 23) return;

              boolean needAudio = ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                    != PackageManager.PERMISSION_GRANTED;
              boolean needCam = ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA)
                    != PackageManager.PERMISSION_GRANTED;

              if (needAudio || needCam) {
                java.util.ArrayList<String> list = new java.util.ArrayList<>();
                if (needAudio) list.add(Manifest.permission.RECORD_AUDIO);
                if (needCam) list.add(Manifest.permission.CAMERA);
                ActivityCompat.requestPermissions(this, list.toArray(new String[0]), REQ_PERMS);
              }
            }

            @Override
            public void onPermissionRequest(final PermissionRequest request) {
              runOnUiThread(new Runnable() {
                @Override
                public void run() {
                  request.grant(request.getResources());
                }
              });
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) {
                getWindow().getDecorView().setSystemUiVisibility(
                  View.SYSTEM_UI_FLAG_LAYOUT_STABLE |
                  View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                  View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                );
              }
            }

            @Override
            protected void onNewIntent(Intent intent) {
              super.onNewIntent(intent);
              handle(intent, true);
            }

            @SuppressWarnings("deprecation")
            private void handle(Intent i, boolean live) {
              if (i == null) return;
              String action = i.getAction();
              String text = null;
              String name = "";
              try {
                if (Intent.ACTION_VIEW.equals(action) && i.getData() != null) {
                  Uri u = i.getData();
                  text = read(u);
                  name = String.valueOf(u.getLastPathSegment());
                } else if (Intent.ACTION_SEND.equals(action)) {
                  Uri u = (Uri) i.getParcelableExtra(Intent.EXTRA_STREAM);
                  if (u != null) {
                    text = read(u);
                    name = String.valueOf(u.getLastPathSegment());
                  } else {
                    text = i.getStringExtra(Intent.EXTRA_TEXT);
                  }
                }
              } catch (Exception e) {
                return;
              }
              if (text == null || text.isEmpty()) return;
              NativeTools.pendingText = text;
              NativeTools.pendingName = name;
              if (live && getBridge() != null && getBridge().getWebView() != null) {
                final String js = "window.openCalcText&&window.openCalcText("
                  + JSONObject.quote(text) + "," + JSONObject.quote(name) + ")";
                getBridge().getWebView().post(new Runnable() {
                  public void run() { getBridge().getWebView().evaluateJavascript(js, null); }
                });
                NativeTools.pendingText = null;
              }
            }

            private String read(Uri u) throws Exception {
              InputStream in = getContentResolver().openInputStream(u);
              ByteArrayOutputStream out = new ByteArrayOutputStream();
              byte[] b = new byte[4096];
              int n, total = 0;
              while ((n = in.read(b)) > 0) {
                out.write(b, 0, n);
                total += n;
                if (total > 300000) break;
              }
              in.close();
              return out.toString("UTF-8");
            }
          }
          EOF

      - name: Patch styles.xml
        run: |
          python3 - <<'PY'
          import os, re

          styles = 'android/app/src/main/res/values/styles.xml'

          if not os.path.exists(styles):
              os.makedirs(os.path.dirname(styles), exist_ok=True)
              content = '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="AppTheme">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:background">@drawable/splash</item>
              </style>
          </resources>
          '''
              open(styles, 'w', encoding='utf-8').write(content)
              print('styles.xml создан с нуля')
          else:
              s = open(styles, encoding='utf-8').read()

              additions = (
                  '        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>\n'
                  '        <item name="android:statusBarColor">@android:color/transparent</item>\n'
                  '        <item name="android:navigationBarColor">@android:color/transparent</item>\n'
              )

              pattern = r'(<style name="AppTheme"[^>]*>)(.*?)(</style>)'

              def repl(m):
                  head, body, tail = m.groups()
                  if 'windowLayoutInDisplayCutoutMode' in body:
                      return m.group(0)
                  return head + '\n' + body.rstrip() + '\n' + additions + tail

              s2, n = re.subn(pattern, repl, s, count=1, flags=re.DOTALL)

              if n == 0:
                  s2 = s.replace('</resources>',
                      '    <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">\n'
                      + additions + '    </style>\n</resources>')

              open(styles, 'w', encoding='utf-8').write(s2)
              print(f'styles.xml обновлён ({n})')
          PY

      - name: Patch AndroidManifest
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()

          perms = ''
          if 'android.permission.VIBRATE' not in s:
              perms += '    <uses-permission android:name="android.permission.VIBRATE"/>\n'
          if 'android.permission.CAMERA' not in s:
              perms += '    <uses-permission android:name="android.permission.CAMERA"/>\n'
          if 'android.permission.RECORD_AUDIO' not in s:
              perms += '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
          if 'android.permission.INTERNET' not in s:
              perms += '    <uses-permission android:name="android.permission.INTERNET"/>\n'
          if 'android.permission.ACCESS_NETWORK_STATE' not in s:
              perms += '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n'
          if perms:
              s = s.replace('</manifest>', perms + '</manifest>')

          queries = '''    <queries>
                <intent>
                    <action android:name="android.speech.RecognitionService"/>
                </intent>
            </queries>
          '''
          if '<queries>' not in s and 'android.speech.RecognitionService' not in s:
              s = s.replace('<application', queries + '\n<application')

          filters = r'''
              <intent-filter>
                <action android:name="android.intent.action.VIEW"/>
                <category android:name="android.intent.category.DEFAULT"/>
                <category android:name="android.intent.category.BROWSABLE"/>
                <data android:scheme="content"/>
                <data android:scheme="file"/>
                <data android:mimeType="text/plain"/>
              </intent-filter>
              <intent-filter>
                <action android:name="android.intent.action.VIEW"/>
                <category android:name="android.intent.category.DEFAULT"/>
                <category android:name="android.intent.category.BROWSABLE"/>
                <data android:scheme="content" android:host="*" android:mimeType="*/*" android:pathPattern=".*\\.calc"/>
                <data android:scheme="file" android:host="*" android:mimeType="*/*" android:pathPattern=".*\\.calc"/>
              </intent-filter>
              <intent-filter>
                <action android:name="android.intent.action.SEND"/>
                <category android:name="android.intent.category.DEFAULT"/>
                <data android:mimeType="text/plain"/>
              </intent-filter>
          '''
          if 'android.intent.action.VIEW' not in s:
              assert '</activity>' in s
              s = s.replace('</activity>', filters + '</activity>', 1)

          if 'android:configChanges' not in s:
              s = s.replace(
                'android:name=".MainActivity"',
                'android:name=".MainActivity"\n            android:configChanges="orientation|screenSize|keyboardHidden|uiMode"'
              )

          open(p, 'w', encoding='utf-8').write(s)
          print('AndroidManifest пропатчен')
          PY

      - name: Sync and build
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CalcX-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CalcX build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk